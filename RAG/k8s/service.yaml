# HeartSignal RAG Service — 클러스터 내부에서는 http://heartsignal-rag:8001
apiVersion: v1
kind: Service
metadata:
  name: heartsignal-rag
  namespace: class-4
  labels:
    part-of: heartsignal
spec:
  type: ClusterIP
  selector:
    app: heartsignal-rag
  ports:
    - name: http
      port: 8001
      targetPort: 8001
