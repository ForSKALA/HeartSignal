# RAG 인덱스(faiss_db) 보존용 PVC
# - /upload-paper, /upload-topic 결과가 파드 재시작 후에도 남도록 한다.
# - ReadWriteOnce(gp3)이므로 rag는 replicas 1로 운영한다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heartsignal-rag-faiss
  namespace: class-4
  labels:
    part-of: heartsignal
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: gp3
