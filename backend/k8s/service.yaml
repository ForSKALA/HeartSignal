# HeartSignal 인증 서버 Service — 클러스터 내부에서는 http://heartsignal-auth:8080
apiVersion: v1
kind: Service
metadata:
  name: heartsignal-auth
  namespace: class-4
  labels:
    part-of: heartsignal
spec:
  type: ClusterIP
  selector:
    app: heartsignal-auth
  ports:
    - name: http
      port: 8080
      targetPort: 8080
