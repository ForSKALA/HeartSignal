# HeartSignal 인증 서버 Deployment (P3)
# - DB_URL은 SimpleAuthServer가 환경변수로 읽는다 (없으면 로컬 기본값).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartsignal-auth
  namespace: class-4
  labels:
    app: heartsignal-auth
    part-of: heartsignal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heartsignal-auth
  template:
    metadata:
      labels:
        app: heartsignal-auth
        part-of: heartsignal
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: auth
          image: skala-registry.skala-us.com/class-4/heartsignal-auth:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: "jdbc:mariadb://heartsignal-db:3306/sql_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heartsignal-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: heartsignal-secret
                  key: JWT_SECRET
            # Ingress 가 https 로 서비스하므로 쿠키에 Secure 를 붙인다
            - name: COOKIE_SECURE
              value: "true"
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx384m"
          envFrom:
            - configMapRef:
                name: heartsignal-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # /login은 정적 HTML을 돌려주므로 준비 상태 확인에 쓴다.
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
