# HeartSignal MariaDB headless Service (P3)
# - StatefulSet의 serviceName. replicas 1이므로 클라이언트는 heartsignal-db:3306 으로 접속한다.
apiVersion: v1
kind: Service
metadata:
  name: heartsignal-db
  namespace: class-4
  labels:
    part-of: heartsignal
spec:
  clusterIP: None
  selector:
    app: heartsignal-db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
