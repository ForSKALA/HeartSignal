# HeartSignal MariaDB StatefulSet (P3)
# - db/docker-compose.yml과 같은 이미지·문자셋 옵션을 쓴다.
# - 초기화 SQL은 heartsignal-db-init ConfigMap(create-init-configmap.sh)으로 넣는다. 데이터가 비어 있을 때 1회만 실행된다.
# - 데이터는 volumeClaimTemplates(gp3)로 보존된다. StatefulSet을 지워도 PVC는 남는다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: heartsignal-db
  namespace: class-4
  labels:
    app: heartsignal-db
    part-of: heartsignal
spec:
  replicas: 1
  serviceName: heartsignal-db
  selector:
    matchLabels:
      app: heartsignal-db
  template:
    metadata:
      labels:
        app: heartsignal-db
        part-of: heartsignal
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --lower_case_table_names=1
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heartsignal-secret
                  key: DB_PASSWORD
            - name: MARIADB_DATABASE
              value: sql_db
            - name: TZ
              value: Asia/Seoul
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: init
          configMap:
            name: heartsignal-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          part-of: heartsignal
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 1Gi
