# HeartSignal MariaDB (backend 인증 서버 / RAG 공용)
# 실행: docker compose -f db/docker-compose.yml up -d
# 접속: jdbc:mariadb://localhost:53301/sql_db  (root / DB_PASSWORD)
# DB_PASSWORD 는 db/.env 또는 셸 환경변수로 반드시 지정한다 (기본 비밀번호 없음, db/.env-example 참고)
# 이미 만들어진 볼륨은 처음 기동할 때의 비밀번호를 계속 쓴다. 기존 사용자는 그 값을 그대로 넣는다.

services:
  mariadb:
    image: mariadb:11.4
    container_name: heartsignal-mariadb
    restart: unless-stopped
    ports:
      - "53301:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 db/.env 또는 환경변수로 설정하세요}
      MARIADB_DATABASE: sql_db
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
    volumes:
      - heartsignal_mariadb_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  heartsignal_mariadb_data:
