# HeartSignal Voice-AI Deployment (음성 담당, 선택 배포)
# - Dockerfile CMD의 --reload는 운영에 맞지 않으므로 여기서 command로 덮어쓴다.
# - /, /index.html 등 경로가 web과 겹치므로 별도 호스트(heartsignal-voice.*)로 연결한다 (web/k8s/ingress.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartsignal-voice
  namespace: class-4
  labels:
    app: heartsignal-voice
    part-of: heartsignal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heartsignal-voice
  template:
    metadata:
      labels:
        app: heartsignal-voice
        part-of: heartsignal
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: voice
          image: skala-registry.skala-us.com/class-4/heartsignal-voice:1.0.0
          imagePullPolicy: Always
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8008"]
          ports:
            - containerPort: 8008
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: heartsignal-secret
                  key: OPENAI_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: heartsignal-secret
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: heartsignal-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: 8008
            periodSeconds: 5
            failureThreshold: 36
          # / 는 JWT가 없으면 401을 돌려주므로 TCP로 확인한다.
          readinessProbe:
            tcpSocket:
              port: 8008
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8008
            periodSeconds: 20
