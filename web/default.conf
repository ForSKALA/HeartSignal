server {
    listen 80;

    # API paths are routed by Ingress; other paths are handled by Vue Router.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # k8s probe용
    location = /healthz {
        access_log off;
        return 200 'ok';
    }
}
