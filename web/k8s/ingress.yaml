# HeartSignal Ingress (P4 단독 관리 — 경로 추가는 P4에게 PR로 요청)
# - 호스트 하나에서 path로 서비스를 나눈다. 화면은 location.origin을 API 주소로 쓰므로 코드 수정이 필요 없다.
# - TLS는 class-4에 이미 있는 와일드카드 인증서를 쓴다 (14.ingress/04.cert-manager 참고).
# - voice는 같은 호스트의 /voice/ 아래로 연결한다 (ingress-voice.yaml, rewrite 는 그 Ingress 에만).
#   별도 호스트(heartsignal-voice.*)는 host-only 로그인 쿠키(ACCESS_TOKEN)를 받지 못해 제거했다 (PR #35).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heartsignal-ingress
  namespace: class-4
  labels:
    part-of: heartsignal
  annotations:
    # PDF 업로드(/upload-paper), 음성 파일 업로드 크기 제한 해제
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # LLM 응답 대기 (LLM_TIMEOUT_S=20보다 길게)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - heartsignal.class-4.skala-us.com
      secretName: wildcard-class-4-skala-us-com-tls
  rules:
    - host: heartsignal.class-4.skala-us.com
      http:
        paths:
          # auth (Java :8080)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: heartsignal-auth
                port:
                  number: 8080
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: heartsignal-auth
                port:
                  number: 8080
          - path: /signup
            pathType: Prefix
            backend:
              service:
                name: heartsignal-auth
                port:
                  number: 8080
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: heartsignal-auth
                port:
                  number: 8080
          - path: /home
            pathType: Prefix
            backend:
              service:
                name: heartsignal-auth
                port:
                  number: 8080
          # rag (FastAPI :8001)
          - path: /rag-query
            pathType: Prefix
            backend:
              service:
                name: heartsignal-rag
                port:
                  number: 8001
          - path: /upload-paper
            pathType: Prefix
            backend:
              service:
                name: heartsignal-rag
                port:
                  number: 8001
          - path: /upload-topic
            pathType: Prefix
            backend:
              service:
                name: heartsignal-rag
                port:
                  number: 8001
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: heartsignal-rag
                port:
                  number: 8001
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: heartsignal-rag
                port:
                  number: 8001
          # web (nginx :80) — 나머지 전부
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heartsignal-web
                port:
                  number: 80
