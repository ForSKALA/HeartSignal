# 루트 docker-compose.yml 의 gateway (nginx). k8s Ingress(web/k8s/ingress*.yaml)와 같은 경로 규칙
# upstream 을 변수로 두고 Docker 내장 DNS 로 요청 때마다 찾는다 → voice 를 띄우지 않아도 nginx 가 기동한다

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50m;   # PDF 업로드·음성 파일

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;    # RAG 답변·지침 7칸 생성

    # auth (Java :8080)
    location ~ ^/(api|login|signup|static|home)(/|$) {
        set $auth http://auth:8080;
        proxy_pass $auth;
    }

    # rag (FastAPI :8001)
    location ~ ^/(rag-query|alarm|board|upload-paper|upload-topic|docs|openapi\.json)(/|$) {
        set $rag http://rag:8001;
        proxy_pass $rag;
    }

    # voice (FastAPI :8008, --root-path /voice). 앞의 /voice 를 떼고 넘긴다
    location ~ ^/voice(/|$)(.*) {
        set $voice http://voice:8008;
        proxy_pass $voice/$2$is_args$args;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # 나머지는 web (Vue, nginx :80)
    location / {
        set $web http://web:80;
        proxy_pass $web;
    }
}
